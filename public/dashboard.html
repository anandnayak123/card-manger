<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Card Tracker — Dashboard</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand small">💳 Card Tracker</h1>
    <div class="topbar-right">
      <span id="welcomeText" class="welcome"></span>
      <button id="profileBtn" class="btn ghost">Profile</button>
      <button id="logoutBtn" class="btn ghost">Log Out</button>
    </div>
  </header>

  <main class="dashboard">
    <div class="dashboard-header">
      <h2>Your Cards</h2>
      <button id="addCardBtn" class="btn primary">+ Add Card</button>
    </div>

    <div id="alertBox" class="alert" style="display:none;"></div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <p>No cards yet. Click <strong>“+ Add Card”</strong> to add your first one.</p>
    </div>

    <div id="cardsGrid" class="cards-grid"></div>
  </main>

  <!-- Add / Edit card modal -->
  <div id="cardModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3 id="cardModalTitle">Add Card</h3>
      <form id="cardForm">
        <input type="hidden" name="id" />
        <label>Bank
          <input type="text" name="bank" placeholder="e.g. HDFC Bank" required />
        </label>
        <label>Card Type
          <select name="type" required>
            <option value="">Select type</option>
            <option>Visa</option>
            <option>Mastercard</option>
            <option>RuPay</option>
            <option>American Express</option>
            <option>Discover</option>
            <option>Other</option>
          </select>
        </label>
        <label>Last 4 Digits
          <input type="text" name="last4" inputmode="numeric" maxlength="4" pattern="\d{4}" placeholder="1234" required />
        </label>
        <label>Due Date
          <input type="date" name="dueDate" required />
        </label>
        <div class="two-col">
          <label>Total Limit
            <input type="number" name="totalLimit" min="1" step="0.01" required />
          </label>
          <label>Used Limit
            <input type="number" name="usedLimit" min="0" step="0.01" value="0" />
          </label>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="cardCancelBtn">Cancel</button>
          <button type="submit" class="btn primary">Save Card</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Payment modal -->
  <div id="paymentModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>Record Bill Payment</h3>
      <form id="paymentForm">
        <input type="hidden" name="id" />
        <p class="modal-sub" id="paymentCardLabel"></p>
        <label>Payment Amount
          <input type="number" name="amount" min="0.01" step="0.01" required />
        </label>
        <label class="checkbox-row">
          <input type="checkbox" name="advanceDueDate" id="advanceDueDate" />
          Advance due date to
        </label>
        <label id="nextDueDateWrap" style="display:none;">
          Next Due Date
          <input type="date" name="nextDueDate" />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="paymentCancelBtn">Cancel</button>
          <button type="submit" class="btn primary">Record Payment</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Profile modal -->
  <div id="profileModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>Profile</h3>
      <form id="profileForm">
        <label>Username
          <input type="text" id="profileUsername" disabled />
        </label>
        <label>Reminder Email
          <input type="email" name="email" id="profileEmail" required />
        </label>
        <div class="modal-actions">
          <button type="button" class="btn ghost" id="profileCancelBtn">Cancel</button>
          <button type="submit" class="btn primary">Update Email</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/dashboard.js"></script>
</body>
</html>
